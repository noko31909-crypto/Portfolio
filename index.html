  name: "Nabi Makhamejanov",
  line: "Grade 10, Bilim-Innovation Lyceum for Gifted Boys, Astana, Kazakhstan",
  intro: [                      // your words; each string is one paragraph
    "I like building things that move and react: a glove that reads a hand, a hand that moves its fingers. Most of what I know comes from video courses, guides and broken parts, three burned sensors included. One day I want to make robots and build kits for schools, so a student can open a kit and find the guide for it on ropros.",

  links: [
    // { label: "GitHub", url: "https://github.com/your-name" },
    // { label: "Email", url: "mailto:you@example.com" },

};

  bending:      [390, 412],    // ADC counts at 45°, bending into the angle
  straightening:[355, 378],    // ADC counts at 45°, straightening back
  window:       [360, 400],    // what the code currently accepts as 45°
  inside: 6, total: 10,        // readings at 45° that fall inside the window
  baselineStart: 648, baselineEnd: 615, cycles: 5,

  // RAW DATA. Type in every measurement and the chart shows each one as
  // a dot instead of a bar, plus a table of all numbers.
  raw: {
    bending:       [],       // 10 readings at 45°, bending in, e.g. [390, 395, ...]

    baseline:      [],       // 0° reading after each cycle, e.g. [648, ..., 615]

};

const PROJECTS = [
  {
    id: "signbridge",
    title: "SignBridge",
    sub: "Flex-sensor glove and a tendon-driven robotic hand",
    facts: [
      ["When", "2025–2026"],
      ["Team", "5 students, mentor Dastan Satuov"],
      ["My role", "System architecture, code, hardware–software integration"],
      ["Result", "1st place, HealthTech, Fibonacci International Robotics Olympiad, final in Turkey, Apr 2026"],

    ],
    text: "SignBridge is a glove that reads gestures and a robotic hand that repeats them, built to make it easier for people to communicate. My part is the glove with its flex sensors, the hand with five servos pulling spring-loaded tendons, and the firmware. At the same 45° the sensor read 390–412 when bending and 355–378 when straightening, so only 6 of 10 readings fell inside my window and the glove sometimes mixed up gestures. Next I’m printing a jig with fixed 0°, 45° and 90° positions to find out whether the spread comes from the sensor or from how the glove fits a hand.",
    // add the wiring diagram as media/signbridge-wiring.jpg (flex sensors,
    // voltage dividers, ESP32 pins; a photo of a hand drawing is fine)
    media: ["signbridge-1.webp", "signbridge-2.webp", "signbridge-test.mp4", "signbridge-wiring.jpg"],
    code: [
      // { label: "Glove firmware (ESP32)", url: "" },
      // { label: "Hand firmware", url: "" },
    ],
    chart: true,
  },
  {
    id: "qorgan",
    title: "QORĞAN AI",

      ["When", "Feb 2026–present"],
      ["My role", "Founder, technical lead"],
      ["What it does", "Real-time threat detection (YOLO), automated alerts, evacuation maps, SOS"],

      ["Classes", ""],                 // what the model detects, e.g. "weapon, fight, fall"
      ["Test frames", ""],             // where the 1,000 frames came from and how they were labelled
    ],
    text: "QORĞAN AI watches school CCTV in real time with a YOLO model and sends alerts, evacuation maps and an SOS when it sees a threat. I started it in February 2026 and lead the technical side; a pilot is now running at NIS. On a 1,000-frame test it was right 88% of the time, which still leaves about 120 wrong frames.",
    // screenshot with detection boxes, faces blurred: media/qorgan-detection.jpg
    media: [],
    code: [
      // { label: "QORĞAN code", url: "" },
    ],
  },
  {
    id: "ropros",
    title: "ropros",
    sub: "Build guides for Arduino, ESP32 and Raspberry Pi in Kazakh, Russian and English",
    facts: [
      ["When", "Sep 2026–present"],
      ["My role", "Founder; I write the guides and built the site"],
      ["Site", "ropros.vercel.app"],
      ["Instagram, TikTok", "@ropros.build"],
    ],
    text: "In September 2026 I started ropros, a site with build guides for Arduino, ESP32 and Raspberry Pi. I write the guides myself in Kazakh, Russian and English, because most good build guides exist only in English and a lot of students here read Kazakh or Russian more easily.",
    media: ["ropros-site.webp", "ropros-guide.webp"],
    link: "https://ropros.vercel.app",
  },
  {
    id: "aila",
    title: "AILA Academy",
    sub: "Student-run AI and robotics courses for school students",
    facts: [
      ["When", "Jan 2026–present"],
      ["My role", "Co-founder; course programs, website, registration and reminder bots"],

      ["June–July 2026", "180 signed up, 150 finished; 7 coordinators, 13 volunteers, 140 work hours"],
      ["Now", "6th cohort, with Future Builders Academy"],
    ],
    text: "AILA Academy was a friend’s idea; I wrote the course programs and built the website and the bots for registration and class reminders. In June–July 2026, 180 students signed up and 30 didn’t finish. I think our programs were simply too long, so we cut them down and split students into small groups, each with a curator who notices when someone falls behind, and more students started reaching the end. Neither change needed any new code.",
    media: ["aila-poster.webp"],
  },
  {
    id: "teaching",
    title: "LEGO and Arduino at an inclusive school",
    sub: "Weekly volunteer classes",
    facts: [
      ["When", "Sep 2025–Jun 2026"],

const SMALL_BUILDS = [

const LOG = [

<style>
:root{

  --silk:#f2f4ef;      /* silkscreen white */

  --ink:#1b211d;
  --muted:#5b6a62;

}

  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{

}
a{color:inherit;text-decoration-color:var(--copper);text-underline-offset:3px}

.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

/* ---------- hero ---------- */

.hero::before{
  /* faint copper traces, the only decoration on the page */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.18;
  background:
    linear-gradient(90deg,transparent 0 62%,var(--copper) 62% calc(62% + 2px),transparent 0) 0 0/100% 100%;
}

.hero h1{
  font-family:"Archivo",system-ui,sans-serif;font-stretch:72%;font-weight:800;
  font-size:clamp(2.6rem,6.2vw,4.6rem);line-height:.95;letter-spacing:-.01em;margin:0 0 18px;
}
.hero .line{font-family:"Archivo",sans-serif;font-stretch:100%;font-size:1rem;color:#cfdcd4;margin:0 0 20px}
.hero .intro{max-width:50ch;margin:0 0 24px}
.hero .intro p{margin:0}
/* first paragraph: the lead, larger */
.hero .intro p:first-child{font-size:1.2rem;line-height:1.6;color:var(--silk)}
/* following paragraphs: a step quieter */
.hero .intro p + p{margin-top:18px;font-size:1rem;color:#cfdcd4}
.hero .links{display:flex;gap:18px;flex-wrap:wrap;font-family:"Archivo",sans-serif}

.me{margin:0 0 22px;display:flex;align-items:center;gap:16px}
.me img{width:104px;height:104px;object-fit:cover;border-radius:50%;border:2px solid var(--copper);display:block;flex:none}
.index{margin-top:28px}
.index ul{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:46ch}
.index a{display:grid;grid-template-columns:9.5rem 1fr;gap:12px;align-items:baseline;padding:8px 0;text-decoration:none;color:var(--silk);border-top:1px solid #2a6148;font-family:"Archivo",sans-serif}
.index li:last-child a{border-bottom:1px solid #2a6148}
.index .t{font-weight:650;font-stretch:90%}

.zoom{display:block;padding:0;border:0;background:none;cursor:zoom-in;border-radius:6px;overflow:hidden}

dialog#viewer{border:0;padding:0;background:transparent;max-width:min(96vw,1400px);max-height:92vh}

.project.wide-media{grid-template-columns:1fr}

.project.wide-media h2,.project.wide-media .sub{grid-column:1}
.project.wide-media dl.facts{grid-column:2;grid-row:1 / span 3}
.project.no-media{grid-template-columns:1fr}
.project.no-media > div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);column-gap:40px;align-items:start}
.project.no-media h2,.project.no-media .sub{grid-column:1}
.project.no-media dl.facts{grid-column:2;grid-row:1 / span 3}
.project.no-media .visit,.project.no-media .text,.project.no-media .code{grid-column:1}
.project h2{

}
.project .sub{color:var(--muted);margin:0 0 22px;max-width:40ch}
dl.facts{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-family:"Archivo",sans-serif;font-size:.95rem}
dl.facts dt{color:var(--muted)}
dl.facts dd{margin:0}
.project .text{margin:22px 0 0;max-width:62ch}
.todo{
  margin:22px 0 0;padding:14px 16px;border:1.5px dashed var(--copper);border-radius:6px;
  font-family:"Archivo",sans-serif;font-size:.92rem;color:var(--copper);background:transparent;
}
.project .visit{display:inline-block;margin-top:16px;font-family:"Archivo",sans-serif}

.media{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:10px;align-content:start}
.media[data-n="1"]{max-width:380px}
.media img,.media video,.media iframe{width:100%;display:block;border-radius:6px;background:var(--hold);aspect-ratio:3/4;object-fit:cover;border:0;max-width:100%}
.media img[src*="poster"]{object-fit:contain;background:#fff}
.media video{object-fit:contain;background:#000}
.missing{
  aspect-ratio:4/3;border-radius:6px;background:var(--hold);border:1px solid var(--rule);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;
  font:500 .85rem/1.4 "Archivo",sans-serif;color:var(--muted)
}


/* ---------- small builds ---------- */
.builds{padding-block:56px 0}
.builds h2{font-family:"Archivo",sans-serif;font-stretch:80%;font-weight:750;font-size:clamp(1.6rem,3vw,2.1rem);margin:0 0 20px}
.builds table{width:100%;border-collapse:collapse;font-family:"Archivo",sans-serif;font-size:.95rem}
.builds th,.builds td{text-align:left;padding:12px 10px;border-top:1px solid var(--rule);vertical-align:top}
.builds th{font-weight:600;color:var(--muted);border-top:0}
.builds td.when{white-space:nowrap;color:var(--muted)}
.builds img,.builds video{width:90px;aspect-ratio:3/4;object-fit:contain;background:#000;border-radius:4px;display:block}

.project .code{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px 18px;font-family:"Archivo",sans-serif;font-size:.95rem}
.raw{margin-top:10px;font:400 .82rem/1.4 "Archivo",sans-serif;color:#b9cbc1}
.raw summary{cursor:pointer;color:var(--copper-soft)}
.raw table{border-collapse:collapse;margin-top:8px;width:100%}
.raw th,.raw td{padding:3px 6px;border-top:1px solid #1f5a40;text-align:right;font-variant-numeric:tabular-nums}
.raw th:first-child,.raw td:first-child{text-align:left}
.log{padding-block:56px 0}
.log h2{font-family:"Archivo",sans-serif;font-stretch:80%;font-weight:750;font-size:clamp(1.6rem,3vw,2.1rem);margin:0 0 20px}
.log ol{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:7.5rem 1fr 1fr;gap:6px 20px;padding:12px 0;border-top:1px solid var(--rule)}
.log time{font-family:"Archivo",sans-serif;color:var(--muted);font-variant-numeric:tabular-nums}
.log .res{color:var(--muted)}
@media (max-width:640px){.log li{grid-template-columns:1fr}}

footer{border-top:1px solid var(--rule);padding:28px 0 48px;color:var(--muted);font:400 .9rem/1.5 "Archivo",sans-serif}

@media (max-width:820px){
  .hero .wrap{grid-template-columns:1fr;gap:32px;padding-top:48px;padding-bottom:40px}
  .hero::before{display:none}
  .project{grid-template-columns:1fr;gap:24px;padding:40px 0}
  .project.no-media > div,.project.wide-media > div:first-child{display:block}
  .index a{grid-template-columns:1fr;gap:2px}

  .builds th:nth-child(2),.builds td.when{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const isVideo = f => /\.(mp4|webm|mov)$/i.test(f);
const isImg = f => /\.(jpe?g|png|webp|avif)$/i.test(f);
const ytId = f => (f.match(/(?:youtu\.be\/|v=)([\w-]{11})/) || [])[1];

function mediaEl(file, wide){
  if(!file) return "";
  const id = ytId(file);
  if(id) return `<iframe src="https://www.youtube-nocookie.com/embed/${id}" title="Video" allowfullscreen loading="lazy"></iframe>`;
  const src = "media/" + file;
  const miss = `this.remove()`;
  if(isVideo(file)) return `<video src="${esc(src)}#t=0.1" controls muted preload="metadata" playsinline onerror="${miss}"></video>`;
  const alt = esc(file.replace(/[-_]/g," ").replace(/\.\w+$/,""));
  return `<button type="button" class="zoom${wide?' first-wide':''}" data-src="${esc(src)}" aria-label="Open photo: ${alt}"><img src="${esc(src)}" alt="${alt}" loading="lazy" onerror="${miss}"></button>`;
}

/* header */
$("#name").textContent = SITE.name;
$("#line").textContent = SITE.line;
const intro = [].concat(SITE.intro || []).filter(Boolean);
if(intro.length) $("#intro").innerHTML = intro.map(t => `<p>${esc(t)}</p>`).join("");
else $("#intro").remove();
$("#links").innerHTML = SITE.links.map(l => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("");
if(!SITE.links.length) $("#links").remove();
$("#index").innerHTML = PROJECTS.map(p => `<li><a href="#${esc(p.id)}"><span class="t">${esc(p.title)}</span><span class="d">${esc((["Result","Status","Reach","My role"].map(k => p.facts.find(f => f[0]===k)).find(Boolean) || ["",""])[1])}</span></a></li>`).join("");

/* sensor chart: ranges only, drawn from SENSOR numbers */
(function(){
  const S = SENSOR, W = 420, H = 260, L = 44, R = 8, T = 24, B = 40;
  const lo = 340, hi = 420;
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const ticks = [340, 360, 380, 400, 420];
  const raw = S.raw || {};
  const dots = (x, vals, fill) => vals.map((v, i) =>
    `<circle cx="${x + 35 + (i % 2 ? 1 : -1) * Math.ceil(i / 2) * 6}" cy="${y(v)}" r="4.5" fill="${fill}" stroke="#0c3123" stroke-width="1"><title>${v}</title></circle>`).join("");
  const col = (x, r, label, fill, vals) => `
    ${vals && vals.length
      ? `<rect x="${x}" y="${y(r[1])}" width="70" height="${y(r[0]) - y(r[1])}" rx="3" fill="${fill}" opacity=".18"/>${dots(x, vals, fill)}`
      : `<rect x="${x}" y="${y(r[1])}" width="70" height="${y(r[0]) - y(r[1])}" rx="3" fill="${fill}"/>`}
    <text x="${x + 35}" y="${H - B + 20}" text-anchor="middle">${label}</text>
    <text x="${x + 35}" y="${y(r[1]) - 6}" text-anchor="middle" class="v">${r[0]}–${r[1]}</text>`;
  const svg = `
  <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Bending gives ${S.bending[0]} to ${S.bending[1]}, straightening gives ${S.straightening[0]} to ${S.straightening[1]}, accepted window ${S.window[0]} to ${S.window[1]}">
    <style>
      text{font:500 13px Archivo,sans-serif;fill:#cfdcd4}
      .v{fill:#f2f4ef;font-weight:700;font-size:15px}
      .ax{stroke:#2f6b50;stroke-width:1}
    </style>
    ${ticks.map(t => `<line class="ax" x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join("")}
    <rect x="${L}" y="${y(S.window[1])}" width="${W - L - R}" height="${y(S.window[0]) - y(S.window[1])}" fill="none" stroke="#f2f4ef" stroke-dasharray="5 5" stroke-width="1.2"/>
    <text x="${W - R - 4}" y="${y(S.window[1]) - 6}" text-anchor="end">code accepts ${S.window[0]}–${S.window[1]}</text>
    ${col(L + 50, S.bending, "bending in", "#e2b47a", raw.bending)}
    ${col(L + 210, S.straightening, "straightening back", "#b8792f", raw.straightening)}
  </svg>`;
  $("#chart").innerHTML = svg;
  const gap = Math.round(((S.bending[0]+S.bending[1]) - (S.straightening[0]+S.straightening[1])) / 2);
  $("#chart-note").textContent =
    `Gap between directions ≈ ${gap} counts. ${S.inside} of ${S.total} readings fall in the window. ` +
    `0° baseline drifted from ${S.baselineStart} to ${S.baselineEnd} over ${S.cycles} cycles.`;

  const rows = [["Bending in, 45°", raw.bending], ["Straightening, 45°", raw.straightening], ["0° baseline, per cycle", raw.baseline]]
    .filter(r => r[1] && r[1].length);
  if(rows.length){
    const n = Math.max(...rows.map(r => r[1].length));
    $("#raw-table").innerHTML = `<table><thead><tr><th></th>${Array.from({length:n}, (_, i) => `<th>${i + 1}</th>`).join("")}</tr></thead><tbody>${
      rows.map(r => `<tr><td>${esc(r[0])}</td>${Array.from({length:n}, (_, i) => `<td>${r[1][i] ?? ""}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
    $("#raw").hidden = false;
  }
})();

/* projects */
$("#projects").innerHTML = PROJECTS.map(p => `
  <article class="project${p.media.length ? (p.media.length >= 3 ? " wide-media" : "") : " no-media"}" id="${esc(p.id)}" aria-labelledby="${esc(p.id)}-t">
    <div>
      <h2 id="${esc(p.id)}-t">${esc(p.title)}</h2>
      <p class="sub">${esc(p.sub)}</p>
      <dl class="facts">${p.facts.filter(f => f[1]).map(f => `<dt>${esc(f[0])}</dt><dd>${esc(f[1])}</dd>`).join("")}</dl>
      ${p.text ? `<p class="text">${esc(p.text)}</p>` : ""}
      ${(p.code || []).filter(c => c.url).length ? `<nav class="code" aria-label="${esc(p.title)} code">${p.code.filter(c => c.url).map(c => `<a href="${esc(c.url)}">${esc(c.label)}</a>`).join("")}</nav>` : ""}
      ${p.link ? `<a class="visit" href="${esc(p.link)}">Open ${esc(p.title)}</a>` : ""}
    </div>
    ${p.media.length ? `<div class="media" data-n="${p.media.length}" style="--n:${Math.min(p.media.length,3)}">${p.media.map(m => mediaEl(m)).join("")}</div>` : ""}
  </article>`).join("");

/* small builds */
$("#builds").innerHTML = SMALL_BUILDS.map(b => `
  <tr><td>${esc(b[0])}</td><td class="when">${esc(b[1])}</td><td>${esc(b[2] || "")}</td>
  <td class="col-media">${b[3] ? mediaEl(b[3]) : ""}</td></tr>`).join("");

/* experiment log */
if(LOG.length){
  $("#log-list").innerHTML = LOG.map(e => `<li><time>${esc(e[0])}</time><span>${esc(e[1])}</span><span class="res">${esc(e[2] || "")}</span></li>`).join("");
  $("#log").hidden = false;
}

const viewer = $("#viewer");
document.addEventListener("click", e => {
  const b = e.target.closest(".zoom");
  if(b){ $("#viewer-img").src = b.dataset.src; $("#viewer-img").alt = b.getAttribute("aria-label").replace("Open photo: ",""); viewer.showModal(); $("#viewer-close").focus(); }
});
$("#viewer-close").addEventListener("click", () => viewer.close());
viewer.addEventListener("click", e => { if(e.target === viewer) viewer.close(); });

$("#foot").textContent = `© ${new Date().getFullYear()} ${SITE.name}`;
</script>
</body>
</html>
